<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仙境传说自动化</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
<div id="app">
    <div class="navbar">
        <a :class="{ active: currentPage === 'home' }" @click="navigate('home')">主页</a>
        <a :class="{ active: currentPage === 'listUsers' }" @click="navigate('listUsers')">账号列表</a>
        <a :class="{ active: currentPage === 'featureList' }" @click="navigate('featureList')">功能列表</a>
        <a :class="{ active: currentPage === 'settings' }" @click="navigate('settings')">设置</a>
    </div>

    <component
            :is="currentPage === 'home' ? 'Home' :
             currentPage === 'listUsers' ? 'UserList' :
             currentPage === 'addUser' ? 'AddUser' :
             currentPage === 'editUser' ? 'EditUser' :
            currentPage === 'featureList' ? 'FeatureList' :
             'Settings'"
            :user-data="editUserData"
            @navigate="navigate"
            @edit-user="handleEditUser"
    ></component>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
